services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assetforge
      POSTGRES_PASSWORD: assetforge
      POSTGRES_DB: assetforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
    - "6379:6379"

volumes:
  postgres_data: